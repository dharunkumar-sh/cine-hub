<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sivakarthikeyan Doss | Cinematic Portfolio</title>
    <link rel="shortcut icon" href="/logo.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Official cinematic filmography and actor portfolio of Sivakarthikeyan Doss."
    />
    <meta property="og:title" content="Sivakarthikeyan Doss | Cinematic Portfolio" />
    <meta
      property="og:description"
      content="Explore filmography, ratings, reviews, and curated watchlist."
    />
    <meta property="og:image" content="/hero.webp" />

    <!-- Performance: Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://assets-in.bmscdn.com" />
    <link rel="dns-prefetch" href="https://images.ottplay.com" />
    <link rel="dns-prefetch" href="https://m.media-amazon.com" />
    <link rel="dns-prefetch" href="https://static.moviecrow.com" />
    <link rel="dns-prefetch" href="https://i.pinimg.com" />

    <!-- Google Fonts with display=swap for instantaneous text rendering -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap"
    />

    <!-- Critical Above-The-Fold Asset Preloads -->
    <link
      rel="preload"
      as="image"
      href="/hero.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/background.webp"
      type="image/webp"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
